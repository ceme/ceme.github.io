<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crosshair Trail & Smear</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2b2c30; /* Medium-dark sleek neutral grey */
      cursor: none; /* Hide standard cursor to render custom white crosshair */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Minimal UI Overlay */
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      letter-spacing: 0.5px;
      line-height: 1.6;
      pointer-events: none;
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      transition: opacity 0.3s ease;
    }

    .hud kbd {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .stats {
      position: fixed;
      bottom: 16px;
      right: 16px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-family: monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud" id="hud">
    <div><strong>Crosshair Trail</strong></div>
    <div>• <strong>Click</strong> to stamp a cross mark</div>
    <div>• <strong>Click &amp; Drag</strong> to smear cross marks (reacts to speed)</div>
    <div>• Press <kbd>C</kbd> or <kbd>Space</kbd> to clear</div>
  </div>

  <div class="stats" id="stats">Speed: 0.0 px/ms | Marks: 0</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statsEl = document.getElementById('stats');

    let width = 0;
    let height = 0;
    let dpr = window.devicePixelRatio || 1;

    // Persistent marks canvas (offscreen buffer so stamps stay permanent)
    const marksCanvas = document.createElement('canvas');
    const marksCtx = marksCanvas.getContext('2d');

    // Dynamic particles spawned by fast drags
    let particles = [];
    let totalMarksCount = 0;

    // Mouse state
    const mouse = {
      x: -100,
      y: -100,
      prevX: -100,
      prevY: -100,
      lastTime: performance.now(),
      isDown: false,
      speed: 0,
      active: false
    };

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      // Preserve existing marks when resizing
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = marksCanvas.width;
      tempCanvas.height = marksCanvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(marksCanvas, 0, 0);

      // Resize main canvas
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      // Resize offscreen marks canvas
      marksCanvas.width = width * dpr;
      marksCanvas.height = height * dpr;
      marksCtx.scale(dpr, dpr);

      // Restore marks
      marksCtx.drawImage(tempCanvas, 0, 0, tempCanvas.width / (dpr === 1 ? 1 : dpr), tempCanvas.height / (dpr === 1 ? 1 : dpr));
    }

    window.addEventListener('resize', resize);
    resize();

    // Helper to draw a cross mark
    function drawCross(targetCtx, x, y, size, thickness, opacity = 1, rotation = 0, color = '#ffffff') {
      targetCtx.save();
      targetCtx.translate(x, y);
      if (rotation !== 0) {
        targetCtx.rotate(rotation);
      }
      targetCtx.globalAlpha = opacity;
      targetCtx.strokeStyle = color;
      targetCtx.lineWidth = thickness;
      targetCtx.lineCap = 'round';

      const half = size / 2;

      // Draw horizontal bar
      targetCtx.beginPath();
      targetCtx.moveTo(-half, 0);
      targetCtx.lineTo(half, 0);
      targetCtx.stroke();

      // Draw vertical bar
      targetCtx.beginPath();
      targetCtx.moveTo(0, -half);
      targetCtx.lineTo(0, half);
      targetCtx.stroke();

      targetCtx.restore();
    }

    // Helper to stamp a single mark
    function stampMark(x, y, speed = 0, angle = 0) {
      totalMarksCount++;

      // Speed influences the mark's characteristics
      const normalizedSpeed = Math.min(speed / 2.5, 1); // 0 to 1
      const size = 12 + normalizedSpeed * 18; // 12px up to 30px
      const thickness = Math.max(1.2, 2.4 - normalizedSpeed * 1.0); // Thinner when whipping fast
      const opacity = 0.55 + Math.random() * 0.4;
      const jitter = normalizedSpeed * 14;

      const jX = x + (Math.random() - 0.5) * jitter;
      const jY = y + (Math.random() - 0.5) * jitter;
      const rot = (Math.random() - 0.5) * (normalizedSpeed * 0.8);

      drawCross(marksCtx, jX, jY, size, thickness, opacity, rot);

      // At higher speeds, spawn dynamic cross particles that fly off and settle
      if (speed > 0.8) {
        const particleCount = Math.floor(Math.min(speed * 2, 4));
        for (let i = 0; i < particleCount; i++) {
          const spread = (Math.random() - 0.5) * Math.PI * 0.8;
          const pAngle = angle + Math.PI + spread;
          const pSpeed = (speed * 1.5 + Math.random() * 3);
          particles.push({
            x: jX,
            y: jY,
            vx: Math.cos(pAngle) * pSpeed,
            vy: Math.sin(pAngle) * pSpeed,
            size: 6 + Math.random() * 8,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.3,
            alpha: 0.8,
            decay: 0.02 + Math.random() * 0.03
          });
        }
      }
    }

    // Smear interpolation between points
    function smearMarks(x0, y0, x1, y1, speed) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const distance = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      if (distance === 0) return;

      // Spacing reacts dynamically to speed: closer at low speed, staggered & reactive at high speed
      const step = Math.max(4, Math.min(22, 6 + speed * 6));
      const count = Math.ceil(distance / step);

      for (let i = 1; i <= count; i++) {
        const t = i / count;
        const ix = x0 + dx * t;
        const iy = y0 + dy * t;
        stampMark(ix, iy, speed, angle);
      }
    }

    // Event listeners
    window.addEventListener('mousemove', (e) => {
      const now = performance.now();
      const dt = Math.max(now - mouse.lastTime, 1);
      const dx = e.clientX - mouse.x;
      const dy = e.clientY - mouse.y;
      const dist = Math.hypot(dx, dy);

      // Instantaneous speed in px/ms
      mouse.speed = dist / dt;

      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.lastTime = now;
      mouse.active = true;

      if (mouse.isDown) {
        if (mouse.prevX > -50) {
          smearMarks(mouse.prevX, mouse.prevY, mouse.x, mouse.y, mouse.speed);
        } else {
          stampMark(mouse.x, mouse.y, mouse.speed);
        }
      }
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) { // Left click
        mouse.isDown = true;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.prevX = e.clientX;
        mouse.prevY = e.clientY;
        mouse.lastTime = performance.now();
        stampMark(e.clientX, e.clientY, 0);
      }
    });

    window.addEventListener('mouseup', () => {
      mouse.isDown = false;
      mouse.prevX = -100;
      mouse.prevY = -100;
    });

    window.addEventListener('mouseleave', () => {
      mouse.active = false;
      mouse.isDown = false;
    });

    // Touch support for tablets/touch devices
    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      mouse.isDown = true;
      mouse.x = touch.clientX;
      mouse.y = touch.clientY;
      mouse.prevX = touch.clientX;
      mouse.prevY = touch.clientY;
      mouse.lastTime = performance.now();
      mouse.active = true;
      stampMark(touch.clientX, touch.clientY, 0);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const now = performance.now();
      const dt = Math.max(now - mouse.lastTime, 1);
      const dx = touch.clientX - mouse.x;
      const dy = touch.clientY - mouse.y;
      const dist = Math.hypot(dx, dy);

      mouse.speed = dist / dt;
      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;
      mouse.x = touch.clientX;
      mouse.y = touch.clientY;
      mouse.lastTime = now;

      smearMarks(mouse.prevX, mouse.prevY, mouse.x, mouse.y, mouse.speed);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', () => {
      mouse.isDown = false;
      mouse.prevX = -100;
      mouse.prevY = -100;
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyC' || e.code === 'Space') {
        marksCtx.clearRect(0, 0, width, height);
        particles = [];
        totalMarksCount = 0;
      }
    });

    // Main render loop
    function render() {
      // Clear main canvas with grey background
      ctx.fillStyle = '#2b2c30';
      ctx.fillRect(0, 0, width, height);

      // 1. Draw stamped marks from the offscreen canvas
      ctx.drawImage(marksCanvas, 0, 0, width, height);

      // 2. Update and draw dynamic smear particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.rotation += p.vRot;
        p.alpha -= p.decay;

        if (p.alpha <= 0.05) {
          // Stamp particle permanently on the marks canvas when dying
          drawCross(marksCtx, p.x, p.y, p.size, 1.2, 0.45, p.rotation);
          particles.splice(i, 1);
          continue;
        }

        drawCross(ctx, p.x, p.y, p.size, 1.2, p.alpha, p.rotation);
      }

      // 3. Draw active cursor crosshair
      if (mouse.active) {
        const cx = mouse.x;
        const cy = mouse.y;

        // Animated expansion when clicking/dragging
        const isInteracting = mouse.isDown;
        const crosshairSize = isInteracting ? 28 + Math.min(mouse.speed * 8, 16) : 22;
        const gap = isInteracting ? 5 : 4;
        const armLength = (crosshairSize - gap * 2) / 2;

        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4;
        ctx.lineCap = 'square';

        // Draw precision crosshair with center circle or gap
        // Top arm
        ctx.beginPath();
        ctx.moveTo(cx, cy - gap - armLength);
        ctx.lineTo(cx, cy - gap);
        ctx.stroke();

        // Bottom arm
        ctx.beginPath();
        ctx.moveTo(cx, cy + gap);
        ctx.lineTo(cx, cy + gap + armLength);
        ctx.stroke();

        // Left arm
        ctx.beginPath();
        ctx.moveTo(cx - gap - armLength, cy);
        ctx.lineTo(cx - gap, cy);
        ctx.stroke();

        // Right arm
        ctx.beginPath();
        ctx.moveTo(cx + gap, cy);
        ctx.lineTo(cx + gap + armLength, cy);
        ctx.stroke();

        // Tiny center dot
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx, cy, 1, 0, Math.PI * 2);
        ctx.fill();

        // Optional subtle speed aura when dragging fast
        if (mouse.isDown && mouse.speed > 0.4) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(mouse.speed * 0.15, 0.35)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, crosshairSize * 0.75, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      // Update HUD stats
      statsEl.textContent = `Speed: ${(mouse.speed * 10).toFixed(1)} px/f | Marks: ${totalMarksCount + particles.length}`;

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
